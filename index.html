<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="calc">
        <div class="window">
          <input class="a" type="text" step="any" placeholder="A" />
          <span id="operation">?</span>
          <input class="b" type="text" step="any" placeholder="B" />
          <button class="equal" onclick="calculate()">=</button>
          <span id="result">0</span>
        </div>
        <div class="error-field"></div>
        <div class="panel">
          <button class="op percent-btn" onclick="applyPercent()">%</button>
          <button class="op" onclick="setOperation('^', degree)">x^z</button>
          <button class="op" onclick="setOperation('√', root)">√</button>
          <button class="op" onclick="setOperation('+', increase)">+</button>
          <button class="op" onclick="setOperation('-', decrease)">-</button>
          <button class="op" onclick="setOperation('*', multiply)">*</button>
          <button class="op" onclick="setOperation('/', divide)">/</button>
          <button onclick="remove()">C</button>
        </div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
